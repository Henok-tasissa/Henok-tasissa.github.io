<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<meta name="description" content="{meta}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27{color_enc}%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Arial,Helvetica,sans-serif%27 font-size=%2736%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3E{initial}%3C/text%3E%3C/svg%3E">
<style>
  :root {{ --accent:{color}; --ink:#1f2a24; --muted:#5b6b62; --bg:#f6faf7; --card:#ffffff; --line:#dbe7df; }}
  * {{ box-sizing:border-box; }}
  body {{ margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans Ethiopic", sans-serif; }}
  header {{ background:var(--accent); color:#fff; padding:24px 16px; }}
  header .wrap {{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }}
  header a {{ color:#fff; text-decoration:none; font-weight:700; font-size:21px; }}
  header nav {{ margin-left:auto; display:flex; gap:16px; font-size:15px; }}
  header nav a {{ font-weight:600; opacity:.95; }}
  .hero {{ background:var(--accent); color:#fff; padding:40px 16px 48px; text-align:center; }}
  .hero h1 {{ font-size:40px; margin:18px 0 4px; }}
  .hero p {{ margin:0; font-size:20px; opacity:.95; }}
  .wrap {{ max-width:760px; margin:0 auto; padding:0 16px; }}
  main {{ padding:28px 0 60px; }}
  h1 {{ font-size:30px; margin:0 0 6px; }}
  .updated {{ color:var(--muted); margin:0 0 28px; }}
  h2 {{ font-size:21px; margin:34px 0 10px; color:var(--accent); }}
  ul {{ padding-left:22px; }}
  li {{ margin:6px 0; }}
  a {{ color:var(--accent); }}
  .card {{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:14px 0; }}
  .grid {{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px; margin:20px 0; }}
  .grid .card {{ margin:0; display:block; text-decoration:none; color:inherit; }}
  .grid .card:hover {{ border-color:var(--accent); }}
  .grid h3 {{ margin:0 0 4px; font-size:19px; }}
  .grid p {{ margin:0; color:var(--muted); font-size:15px; }}
  .links {{ display:flex; gap:14px; flex-wrap:wrap; margin:8px 0 0; font-size:15px; }}
  .tile {{ display:inline-flex; align-items:center; justify-content:center; background:#fff; color:var(--accent); font-weight:800; border-radius:22%; box-shadow:0 6px 18px rgba(0,0,0,.18); position:relative; }}
  .tile::after {{ content:"🌱"; position:absolute; top:-30%; right:-18%; font-size:.55em; }}
  footer {{ color:var(--muted); font-size:14px; padding:20px 16px 40px; text-align:center; }}
  footer a {{ color:var(--muted); }}
</style>
</head>
<body>
{body}
<footer>© 2026 {owner} · <a href="{root}index.html">All projects</a>{footer_links}</footer>
</body>
</html>
